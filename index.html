<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Shifter Sprint 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header with the person switcher; overview = progress strip, day-one contracts,
   swimlane dependency map (people x merges before), merge-order notes, final-app gallery;
   person page = ordered priority queue, waiting PRs, merged. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #E9EDF4;
  --line: #D6DCE6;
  --fg: #0E1726;
  --muted: #5A6578;
  --accent: #2361E0;
  --accent-soft: #DCE7FC;
  --on-accent: #FFFFFF;
  --wait: #A86A10;
  --wait-soft: #F8EBD3;
  --dev: #7340D8;
  --dev-soft: #ECE4FB;
  --review: #0B7C94;
  --review-soft: #D8F0F5;
  --done: #1A7F43;
  --done-soft: #DAF1E3;
  --edge: #B9C3D3;
  --shadow: 0 1px 2px rgba(14, 23, 38, .06), 0 6px 24px rgba(14, 23, 38, .06);
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1019; --surface: #121A27; --surface-2: #192335; --line: #24314A;
    --fg: #E5EBF5; --muted: #93A0B6; --accent: #5B95FF; --accent-soft: #1A2B4D; --on-accent: #06101F;
    --wait: #E3A94A; --wait-soft: #33270F; --dev: #AE8CFF; --dev-soft: #2A2045;
    --review: #3CC4DD; --review-soft: #0F2E36; --done: #45CF7E; --done-soft: #10301F;
    --edge: #33425C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1019; --surface: #121A27; --surface-2: #192335; --line: #24314A;
  --fg: #E5EBF5; --muted: #93A0B6; --accent: #5B95FF; --accent-soft: #1A2B4D; --on-accent: #06101F;
  --wait: #E3A94A; --wait-soft: #33270F; --dev: #AE8CFF; --dev-soft: #2A2045;
  --review: #3CC4DD; --review-soft: #0F2E36; --done: #45CF7E; --done-soft: #10301F;
  --edge: #33425C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: .86em; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 20px; font-weight: 700; }
.brand .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.live .dot { background: var(--done); box-shadow: 0 0 0 3px var(--done-soft); }
.sync.warn .dot { background: var(--wait); box-shadow: 0 0 0 3px var(--wait-soft); }
.sync .err { color: var(--wait); font-weight: 600; }
.syncbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.btn.small { padding: 4px 10px; font-size: 13px; }
form.tok { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
form.tok label { width: 100%; font-size: 13px; font-weight: 600; color: var(--muted); }
form.tok input { flex: 1 1 240px; min-width: 0; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 14px; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 70ch; }
.nav { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px 10px; scrollbar-width: thin; }
.nav a { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); white-space: nowrap; font-weight: 500; font-size: 14px; background: var(--surface); }
.nav a:hover { text-decoration: none; border-color: var(--accent); }
.nav a[aria-current="page"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.nav a.overview { padding-left: 12px; }
.av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--fg); font-family: var(--display); flex: none; }
.nav a[aria-current="page"] .av { background: var(--bg); color: var(--fg); }
.nav .cnt { font-family: var(--mono); font-size: 11px; opacity: .7; }

main { padding-block: 24px 64px; display: grid; gap: 36px; }
section > h2 { font-size: 22px; margin-bottom: 4px; }
.lede { color: var(--muted); margin: 0 0 14px; max-width: 68ch; }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill svg { width: 12px; height: 12px; flex: none; }
.pill.done { background: var(--done-soft); color: var(--done); }
.pill.review { background: var(--review-soft); color: var(--review); }
.pill.dev { background: var(--dev-soft); color: var(--dev); }
.pill.ready { background: var(--accent-soft); color: var(--accent); }
.pill.wait { background: var(--wait-soft); color: var(--wait); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.day1 { background: var(--fg); color: var(--bg); }

/* Progress strip */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; }
.stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.stat .v { font-family: var(--display); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; color: var(--muted); font-weight: 500; }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin-top: 12px; }
.bar span { display: block; height: 100%; }
.bar .done { background: var(--done); } .bar .review { background: var(--review); } .bar .dev { background: var(--dev); } .bar .ready { background: var(--accent); } .bar .wait { background: var(--wait); opacity: .55; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Day one */
.dayone { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.d1 { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; cursor: pointer; text-align: left; }
.d1:hover { border-color: var(--accent); }
.d1 .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.d1 h3 { font-size: 16px; }
.d1 p { margin: 0; font-size: 13px; color: var(--muted); }
.d1 .unl { font-size: 13px; font-weight: 600; color: var(--fg); }

/* Dependency map */
.map-tools { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.map-tools svg { vertical-align: middle; }
.map-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.map { position: relative; min-width: 940px; display: grid; grid-template-columns: 116px repeat(4, minmax(0, 1fr)); }
.map .colh { padding: 12px 12px 10px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); position: relative; z-index: 2; }
.map .colh b { display: block; font-family: var(--display); font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--fg); }
.map .lane-name { padding: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; position: relative; z-index: 2; background: var(--surface); }
.map .lane-name a { color: var(--fg); }
.map .cell { padding: 10px 14px 10px 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 2; }
.map .lane-first { border-top: 0; }
.edges { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: visible; }
.edges path { fill: none; stroke: var(--edge); stroke-width: 1.4; transition: stroke .15s, opacity .15s; }
.edges path.order { stroke-dasharray: 5 4; }
.edges path.met { stroke: var(--done); opacity: .45; }
.map.focus .edges path { opacity: .12; }
.map.focus .edges path.hl { opacity: 1; stroke: var(--accent); stroke-width: 2; }
.chip { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 8px; width: 100%; text-align: left; padding: 7px 9px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; line-height: 1.25; transition: opacity .15s, border-color .15s, background .15s; }
.chip .num { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); }
.chip .lbl { font-weight: 500; min-width: 0; }
.chip .ic { width: 14px; height: 14px; }
.chip.ready { border-color: var(--accent); }
.chip.ready .ic { color: var(--accent); }
.chip.wait { border-style: dashed; color: var(--muted); }
.chip.wait .ic { color: var(--wait); }
.chip.dev { border-color: var(--dev); } .chip.dev .ic { color: var(--dev); }
.chip.review { border-color: var(--review); } .chip.review .ic { color: var(--review); }
.chip.done { background: var(--done-soft); border-color: transparent; } .chip.done .ic, .chip.done .num { color: var(--done); }
.chip:hover { border-color: var(--fg); }
.map.focus .chip { opacity: .3; }
.map.focus .chip.hl { opacity: 1; }
.map.focus .chip.me { opacity: 1; box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }

/* Notes */
.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.note h3 { font-size: 15px; font-family: var(--mono); font-weight: 600; letter-spacing: 0; overflow-wrap: anywhere; }
.note p { margin: 0; color: var(--muted); font-size: 14px; }
.order-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.order-line .arrow { color: var(--muted); }
.mini { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.mini .who { font-family: var(--body); font-weight: 500; color: var(--muted); }
.mini.done { background: var(--done-soft); border-color: transparent; color: var(--done); }
.mini.review { border-color: var(--review); color: var(--review); }
.mini.dev { border-color: var(--dev); color: var(--dev); }
.mini.ready { border-color: var(--accent); color: var(--accent); }
.mini.wait { border-style: dashed; color: var(--muted); }
.mini:hover { border-color: var(--fg); }

/* Gallery */
.gal-group { display: grid; gap: 10px; margin-top: 18px; }
.gal-group h3 { font-size: 16px; }
.gal { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x proximity; }
.gal figure { margin: 0; flex: 0 0 auto; width: 210px; scroll-snap-align: start; display: grid; gap: 8px; align-content: start; }
.gal .shot { display: block; padding: 0; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #0A1019; cursor: zoom-in; width: 100%; }
.gal .shot img { display: block; width: 100%; height: 420px; object-fit: cover; object-position: top; }
.gal figcaption { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.gal figcaption .tags { display: flex; flex-wrap: wrap; gap: 4px; }

/* Person page */
.person-head { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.person-head .big-av { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--fg); color: var(--bg); font-family: var(--display); font-weight: 700; font-size: 22px; }
.person-head h2 { font-size: 30px; }
.person-head .role { color: var(--muted); margin: 2px 0 0; }
.person-head .meter { text-align: right; min-width: 170px; }
.person-head .meter .v { font-family: var(--display); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.person-head .meter .k { font-size: 13px; color: var(--muted); }
.person-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
.col { display: grid; gap: 28px; min-width: 0; }
.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 120px); }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.sec-h h2 { font-size: 20px; }
.sec-h .count { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.list { display: grid; gap: 14px; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; box-shadow: var(--shadow); min-width: 0; }
.task.wait { box-shadow: none; background: transparent; border-style: dashed; }
.task.done { box-shadow: none; }
.task-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.task-top .ord { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent); color: var(--on-accent); font-family: var(--display); font-weight: 700; font-size: 14px; }
.task-top .ids { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted); }
.task-top .sp { flex: 1; }
.task h3 { font-size: 19px; }
.task .en { margin: -6px 0 0; font-size: 13px; color: var(--muted); }
.task .sum { margin: 0; max-width: 68ch; }
.thumbs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.thumbs button { flex: 0 0 auto; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #0A1019; cursor: zoom-in; }
.thumbs img { display: block; height: 190px; width: auto; max-width: none; }
.rel { display: grid; gap: 6px; font-size: 14px; }
.rel-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rel-row .k { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 2px; }
.hint { margin: 0; font-size: 14px; padding: 8px 12px; border-radius: 9px; background: var(--surface-2); }
.hint.wait { background: var(--wait-soft); color: var(--fg); }
.task-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.box h3 { font-size: 15px; }
.box p { margin: 0; font-size: 14px; color: var(--muted); }
.box ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.box li { display: grid; gap: 3px; font-size: 14px; }
.box li .l1 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.merged-list { display: grid; gap: 8px; }
.merged-list .mrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--done-soft); }
.merged-list .mrow b { font-weight: 600; }

/* Dialog */
dialog { border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--fg); width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(6, 10, 18, .55); }
.dlg { display: grid; grid-template-rows: auto 1fr; max-height: calc(100vh - 48px); }
.dlg-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { font-size: 22px; }
.dlg-head .en { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; }
.dlg-body { overflow: auto; padding: 16px 20px 22px; display: grid; gap: 18px; }
.dlg-body h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.dlg-body ul.todo { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: 72ch; }
.shots { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.shots figure { margin: 0; flex: 0 0 auto; display: grid; gap: 6px; width: min(300px, 74vw); }
.shots img { width: 100%; border-radius: 14px; border: 1px solid var(--line); background: #0A1019; }
.shots figcaption { font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.status-ctl { display: grid; gap: 8px; }
.status-ctl p { margin: 0; font-size: 13px; color: var(--muted); }
.img-only { padding: 12px; display: grid; gap: 10px; justify-items: center; }
.img-only img { max-height: calc(100vh - 140px); width: auto; border-radius: 16px; }
.img-only p { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }

@media (max-width: 900px) {
  .person-grid { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .dayone { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .notes { grid-template-columns: minmax(0, 1fr); }
  .dayone { grid-template-columns: minmax(0, 1fr); }
  .person-head { grid-template-columns: auto 1fr; }
  .person-head .meter { grid-column: 1 / -1; text-align: left; }
  .person-head h2 { font-size: 24px; }
  .thumbs img { height: 150px; }
  .gal figure { width: 170px; }
  .gal .shot img { height: 340px; }
  dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 18px 18px 0 0; max-height: 92vh; }
  .dlg { max-height: 92vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">

/* ---------- state ---------- */
const BY = Object.fromEntries(TASKS.map(t => [t.n, t]));
const PBY = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
const RANK = { todo: 0, dev: 1, review: 2, done: 3 };
const STATES = ["todo", "dev", "review", "done"];
let board = { syncedAt: null, items: {} };
let manual = {};
let live = false, dbRef = null, canWrite = null;

const blockers = t => [...t.deps, ...t.after];
const dependents = n => TASKS.filter(t => blockers(t).includes(n));
function allDependents(n, acc = new Set()) { for (const t of dependents(n)) if (!acc.has(t.n)) { acc.add(t.n); allDependents(t.n, acc); } return acc; }
function allBlockers(n, acc = new Set()) { for (const b of blockers(BY[n])) if (!acc.has(b)) { acc.add(b); allBlockers(b, acc); } return acc; }
const depthMemo = {};
function depth(n) { if (n in depthMemo) return depthMemo[n]; const b = blockers(BY[n]); return depthMemo[n] = b.length ? 1 + Math.max(...b.map(depth)) : 0; }

function boardState(n) { const it = board.items[String(n)]; return it && STATES.includes(it.state) ? it.state : "todo"; }
function manualState(n) { const m = manual[String(n)]; return m && STATES.includes(m.state) ? m.state : null; }
function workState(n) { const b = boardState(n), m = manualState(n); return m && RANK[m] > RANK[b] ? m : b; }
const isDone = n => workState(n) === "done";
const unmet = t => blockers(t).filter(b => !isDone(b));
function view(n) { // done | review | dev | ready | wait
  const w = workState(n);
  if (w === "done") return "done";
  if (unmet(BY[n]).length) return w === "todo" ? "wait" : w;
  return w === "todo" ? "ready" : w;
}
const LABEL = { done: "Mergée", review: "En review", dev: "En dev", ready: "Prête", wait: "En attente" };
const ICON = {
  done: '<svg viewBox="0 0 16 16" class="ic" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  wait: '<svg viewBox="0 0 16 16" class="ic" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 7V5.2a2.5 2.5 0 015 0V7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
};

const dur = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? " " + String(m % 60).padStart(2, "0") : ""}`;

const mini = (n, showWho = true) => { const v = view(n); return `<button class="mini ${v}" data-open="${n}" title="${esc(BY[n].title)} · ${LABEL[v]}">${v === "done" ? "✓ " : ""}#${n}${showWho ? ` <span class="who">${who(n)}</span>` : ""}</button>`; };
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function drawEdges() {
  const mapEl = document.getElementById("map"), svg = document.getElementById("edges");
  if (!mapEl || !svg) return;
  const mr = mapEl.getBoundingClientRect();
  svg.setAttribute("width", mapEl.scrollWidth); svg.setAttribute("height", mapEl.scrollHeight);
  svg.setAttribute("viewBox", `0 0 ${mapEl.scrollWidth} ${mapEl.scrollHeight}`);
  const pos = {};
  mapEl.querySelectorAll(".chip").forEach(c => { const r = c.getBoundingClientRect(); pos[c.dataset.n] = { l: r.left - mr.left, r: r.right - mr.left, y: r.top - mr.top + r.height / 2 }; });
  let out = "";
  for (const t of TASKS) {
    for (const [list, cls] of [[t.deps, "need"], [t.after, "order"]]) {
      for (const b of list) {
        const a = pos[b], z = pos[t.n]; if (!a || !z) continue;
        const x1 = a.r, x2 = z.l, dx = Math.max(24, (x2 - x1) / 2);
        out += `<path class="${cls}${isDone(b) ? " met" : ""}" data-from="${b}" data-to="${t.n}" d="M${x1} ${a.y} C${x1 + dx} ${a.y}, ${x2 - dx} ${z.y}, ${x2} ${z.y}"/>`;
      }
    }
  }
  svg.innerHTML = out;
}
function focusChain(n) {
  const mapEl = document.getElementById("map"); if (!mapEl) return;
  if (n == null) { mapEl.classList.remove("focus"); mapEl.querySelectorAll(".hl,.me").forEach(e => e.classList.remove("hl", "me")); return; }
  const set = new Set([n, ...allBlockers(n), ...allDependents(n)]);
  mapEl.classList.add("focus");
  mapEl.querySelectorAll(".chip").forEach(c => { const k = +c.dataset.n; c.classList.toggle("hl", set.has(k)); c.classList.toggle("me", k === n); });
  mapEl.querySelectorAll(".edges path").forEach(p => p.classList.toggle("hl", set.has(+p.dataset.from) && set.has(+p.dataset.to)));
}

}
function waitHint(t) {
  const u = unmet(t);
  const others = u.filter(b => BY[b].who !== t.who), mine = u.filter(b => BY[b].who === t.who);
  if (u.every(b => CONTRACTS.includes(b))) return `Tu peux déjà coder contre le contrat ${u.map(b => "#" + b).join(", ")} avec les fakes ; tu merges quand ${u.length > 1 ? "ils sont mergés" : "il est mergé"}.`;
  if (!others.length) return `Après ta ${mine.map(b => "#" + b).join(" et ta ")}.`;
  const ord = u.filter(b => t.after.includes(b));
  if (ord.length === u.length) return `Code prêt avant, mais merge après ${ord.map(b => "#" + b).join(", ")} : même fichier, tu rebases dessus.`;
  return `Commence avec les fakes ; merge quand ${u.map(b => "#" + b).join(", ")} ${u.length > 1 ? "sont mergées" : "est mergée"}.`;
}
function taskCard(t, order) {

function renderPerson(id) {

  const prio = { review: 0, dev: 1, ready: 2 };
  const now = mine.filter(t => ["ready", "dev", "review"].includes(view(t.n)))
    .sort((a, b) => (b.day1 ? 1 : 0) - (a.day1 ? 1 : 0) || prio[view(a.n)] - prio[view(b.n)] || mine.indexOf(a) - mine.indexOf(b));
  const waiting = mine.filter(t => view(t.n) === "wait");
  const done = mine.filter(t => view(t.n) === "done");

  const reviewSet = new Map();
  waiting.forEach(t => unmet(t).filter(b => BY[b].who !== id).forEach(b => { if (!reviewSet.has(b)) reviewSet.set(b, []); reviewSet.get(b).push(t.n); }));
  const reviews = [...reviewSet.entries()].map(([b, forN]) => {
    const v = view(b), pr = prsOf(b).find(x => x.state === "OPEN");
    const act = v === "review" ? (pr ? `<a href="${REPO}/pull/${pr.n}" target="_blank" rel="noopener">Va reviewer la PR #${pr.n} ↗</a>` : "PR ouverte : va la reviewer") : v === "dev" ? "En dev, pas encore de PR" : v === "wait" ? "Elle-même attend une merge" : "Pas encore commencée";
    return `<li><span class="l1">${mini(b)}${pill(v)}</span><span>${act} · débloque ta ${forN.map(n => "#" + n).join(", ")}</span></li>`;
  }).join("");

  const waitMe = new Map();
  mine.filter(t => !isDone(t.n)).forEach(t => dependents(t.n).filter(d => d.who !== id).forEach(d => { if (!waitMe.has(d.n)) waitMe.set(d.n, []); waitMe.get(d.n).push(t.n); }));
  const waiters = [...waitMe.entries()].map(([d, from]) => `<li><span class="l1">${mini(d)}</span><span>attend ta ${from.map(n => "#" + n).join(", ")}</span></li>`).join("");

  const emptyNow = waiting.length
    ? `<div class="empty">Rien n'est prêt à merger. Commence <b>#${waiting[0].n}</b> : ${waitHint(waiting[0]).replace(/^./, c => c.toLowerCase())}</div>`
    : `<div class="empty">Plus rien à faire : tout est mergé.</div>`;

  return `
  <section class="person-head">
    <div class="big-av">${p.name[0]}</div>
    <div><h2>${p.name}</h2><p class="role">${p.role} · <a href="https://github.com/${p.gh}" target="_blank" rel="noopener">@${p.gh}</a></p></div>
    <div class="meter"><div class="v">${done.length}/${mine.length} mergées</div><div class="k">${hours(minDone)} sur ${hours(minAll)} prévues</div>
      <div class="bar">${done.length ? `<span class="done" style="width:${minDone / minAll * 100}%"></span>` : ""}</div></div>
  </section>
  <div class="person-grid">
    <div class="col">
      <section>
        <div class="sec-h"><h2>À faire en priorité</h2><span class="count">${now.length}</span></div>
        <p class="lede">${p.note}</p>
        <div class="list">${now.length ? now.map((t, i) => taskCard(t, i + 1)).join("") : emptyNow}</div>
      </section>
      <section>
        <div class="sec-h"><h2>En attente d'une merge</h2><span class="count">${waiting.length}</span></div>
        <p class="lede">Elles passent toutes seules dans « À faire en priorité » quand ce qu'elles attendent passe en Done sur le Scrum Board.</p>
        <div class="list">${waiting.length ? waiting.map(t => taskCard(t)).join("") : '<div class="empty">Aucune PR en attente.</div>'}</div>
      </section>
      ${done.length ? `<section><div class="sec-h"><h2>Mergées</h2><span class="count">${done.length}</span></div>
        <div class="merged-list">${done.map(t => `<div class="mrow">${pill("done")}<b>#${t.n} ${t.short}</b><span>${dur(t.est)}</span><button class="btn" data-open="${t.n}">Détail</button></div>`).join("")}</div></section>` : ""}
    </div>
    <aside class="side">
      <div class="box"><h3>Reviews qui te débloquent</h3>${reviews ? `<ul>${reviews}</ul>` : "<p>Rien : aucune de tes PR n'attend quelqu'un d'autre.</p>"}</div>
      <div class="box"><h3>Ils attendent tes PR</h3>${waiters ? `<ul>${waiters}</ul>` : "<p>Personne n'attend tes PR.</p>"}</div>
    </aside>
  </div>`;
}

/* ---------- dialog ---------- */
const dlg = document.getElementById("dlg");
let dlgTask = null;
function openTask(n) { dlgTask = n; renderDialog(); if (!dlg.open) dlg.showModal(); }
function renderDialog() {
  if (dlgTask == null) return;
  const t = BY[dlgTask], v = view(t.n), u = unmet(t), deps = dependents(t.n);
  const b = boardState(t.n), m = manualState(t.n), it = board.items[String(t.n)];
  const ctl = (live && canWrite !== false) ? `<div class="status-ctl"><h4>Changer le statut à la main</h4>
      <div class="seg" role="group" aria-label="Statut">${STATES.map(s => `<button data-set="${s}" aria-pressed="${workState(t.n) === s}" ${RANK[s] < RANK[b] ? "disabled" : ""}>${{ todo: "À faire", dev: "En dev", review: "En review", done: "Mergée" }[s]}</button>`).join("")}</div>
      <p>Le Scrum Board reste la source : ${it ? `il dit « ${esc(it.status || "—")} »` : "pas encore lu"}${m ? `. Statut mis à la main : ${LABEL[m === "todo" ? "ready" : m]}. <button class="btn" data-set="reset" style="padding:3px 9px;font-size:12px">Revenir au board</button>` : "."}</p></div>` : "";
  dlg.innerHTML = `<div class="dlg">
    <div class="dlg-head"><div><div class="task-top"><span class="ids">#${t.n} · ${t.code} · ${who(t.n)}</span>${t.day1 ? '<span class="tag day1">Jour 1</span>' : ""}<span class="tag">${t.prio}</span><span class="tag">${dur(t.est)}</span><span class="tag">story #${t.story}</span>${pill(v)}</div>
      <h2 id="dlgTitle">${t.short}</h2><p class="en">${t.title}</p></div>
      <button class="x" data-close aria-label="Fermer">×</button></div>
    <div class="dlg-body">
      <p style="margin:0;max-width:72ch">${t.sum}</p>
      ${t.imgs.length ? `<div><h4>Ce qu'on veut à l'écran</h4><div class="shots">${t.imgs.map(id => `<figure><img src="img/${id}.png" alt="${esc(IMG[id])}" loading="lazy"><figcaption>${esc(IMG[id])}</figcaption></figure>`).join("")}</div></div>` : ""}
      <div><h4>À faire dans la PR</h4><ul class="todo">${t.todo.map(x => `<li>${x}</li>`).join("")}</ul></div>
      ${t.note ? `<p class="hint">${t.note}</p>` : ""}
      ${v === "wait" ? `<p class="hint wait">${waitHint(t)}</p>` : ""}
      <div class="rel">
        ${blockers(t).length ? `<div class="rel-row"><span class="k">Dépend de</span>${blockers(t).map(x => mini(x) + (t.after.includes(x) ? '<span class="tag">ordre de merge</span>' : "")).join("")}</div>` : `<div class="rel-row"><span class="k">Dépend de</span><span>rien : à commencer tout de suite</span></div>`}
        ${deps.length ? `<div class="rel-row"><span class="k">Débloque</span>${deps.map(d => mini(d.n)).join("")}</div>` : ""}
        ${t.wires.length ? `<div class="rel-row"><span class="k">Branchement final</span>${t.wires.map(w => mini(w)).join("")}<span class="tag">ne bloque pas</span></div>` : ""}
      </div>
      <div class="task-foot">${links(t)}</div>
      ${ctl}
    </div></div>`;
}
function openImage(id) {
  dlgTask = null;
  dlg.innerHTML = `<div class="dlg"><div class="dlg-head"><h2 id="dlgTitle" style="font-size:17px">${esc(IMG[id])}</h2><button class="x" data-close aria-label="Fermer">×</button></div>
    <div class="dlg-body img-only"><img src="img/${id}.png" alt="${esc(IMG[id])}"><p><a href="${FIGMA}${id}" target="_blank" rel="noopener">Ouvrir dans Figma ↗</a></p></div></div>`;
  if (!dlg.open) dlg.showModal();
}
dlg.addEventListener("click", e => {
  if (e.target === dlg || e.target.closest("[data-close]")) { dlg.close(); return; }
});
dlg.addEventListener("close", () => { dlgTask = null; });

async function setManual(s) {
  if (!dbRef || dlgTask == null) return;
  const n = dlgTask;
  try {
    if (s === "reset") await dbRef.doc("manual/" + n).delete();
    else await dbRef.doc("manual/" + n).set({ state: s, at: new Date().toISOString() });
    toast(s === "reset" ? `#${n} suit de nouveau le Scrum Board` : `#${n} : ${{ todo: "À faire", dev: "En dev", review: "En review", done: "Mergée" }[s]}`);
  } catch (e) {
    if (e && e.code === "invalid_argument") { canWrite = false; renderDialog(); toast("Pas enregistré : tu as cette page en lecture seule."); }
    else toast("Pas enregistré : réessaie dans un instant.");
  }
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2800); }

/* ---------- live GitHub ---------- */
let source = "none", loading = false, lastLoad = 0, liveError = "", memToken = "";
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || memToken; } catch (_) { return memToken; } }
function saveToken(v) { memToken = v; try { if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY); } catch (_) {} }
function stateOf(status, issue, prs) {
  const s = (status || "").toLowerCase();
  if (issue === "CLOSED" || s.startsWith("done") || prs.some(p => p.state === "MERGED")) return "done";
  if (s === "in review") return "review";
  if (s === "in development") return "dev";
  if (prs.some(p => p.state === "OPEN")) return "review";
  return "todo";
}
const GQL = `query { repository(owner:"Shifter-Swent", name:"shifter") { ${TASKS.map(t => `i${t.n}: issue(number:${t.n}) { ...F }`).join(" ")} } }
fragment F on Issue { number state
  projectItems(first: 10) { nodes { project { id } status: fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } } }
  closedByPullRequestsReferences(first: 5, includeClosedPrs: true) { nodes { number state } } }`;
async function fetchBoard(token) {
  const r = await fetch("https://api.github.com/graphql", { method: "POST", headers: { Authorization: "bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify({ query: GQL }) });
  if (r.status === 401) throw { code: "bad_token" };
  if (!r.ok) throw { code: "http", status: r.status };
  const j = await r.json();
  const repo = (j.data && j.data.repository) || null;
  if (!repo) throw { code: "gql" };
  const items = {};
  for (const t of TASKS) {
    const is = repo["i" + t.n]; if (!is) continue;
    const pi = ((is.projectItems && is.projectItems.nodes) || []).find(x => x && x.project && x.project.id === PROJECT_ID);
    const status = (pi && pi.status && pi.status.name) || "";
    const prs = ((is.closedByPullRequestsReferences && is.closedByPullRequestsReferences.nodes) || []).filter(Boolean).map(p => ({ n: p.number, state: p.state }));
    items[t.n] = { status, issue: is.state, prs, state: stateOf(status, is.state, prs) };
  }
  if (!Object.values(items).some(x => x.status)) throw { code: "no_project" };
  return { syncedAt: new Date().toISOString(), items };
}
async function fetchPublic() { // sans token : issues fermées et PR liées, par-dessus le dernier instantané du board
  const items = JSON.parse(JSON.stringify(board.items || {}));
  const nums = new Set(TASKS.map(t => t.n));
  const get = n => items[n] || (items[n] = { status: "", issue: "OPEN", prs: [], state: "todo" });
  let url = "https://api.github.com/repos/Shifter-Swent/shifter/issues?state=all&per_page=100&since=2026-11-18T00:00:00Z";
  for (let page = 0; page < 4 && url; page++) {
    const r = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw { code: "http", status: r.status };
    for (const it of await r.json()) {
      if (it.pull_request) {
        const text = (it.title || "") + " " + (it.body || "");
        const refs = [...text.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => +m[1]).filter(n => nums.has(n));
        const st = it.pull_request.merged_at ? "MERGED" : it.state === "closed" ? "CLOSED" : "OPEN";
        for (const n of refs) { const x = get(n); x.prs = [...(x.prs || []).filter(p => p.n !== it.number), { n: it.number, state: st }]; }
      } else if (nums.has(it.number)) get(it.number).issue = it.state === "closed" ? "CLOSED" : "OPEN";
    }
    const m = (r.headers.get("Link") || "").match(/<([^>]+)>;\s*rel="next"/);
    url = m ? m[1] : null;
  }
  for (const x of Object.values(items)) { const s = stateOf(x.status, x.issue, x.prs || []); if (!STATES.includes(x.state) || RANK[s] > RANK[x.state]) x.state = s; }
  return { syncedAt: board.syncedAt, items };
}
function liveMessage(e) {
  if (e && e.code === "bad_token") return "Token refusé ou expiré : reconnecte le Scrum Board.";
  if (e && e.code === "no_project") return "Ce token ne lit pas le Scrum Board : il lui faut read:project.";
  if (e && e.status === 403) return "GitHub limite les requêtes : réessaie dans quelques minutes.";
  return "GitHub ne répond pas : statut du dernier instantané.";
}
async function loadLive(force) {
  if (IN_ARTIFACT || loading) return;
  if (!force && Date.now() - lastLoad < 15000) return;
  loading = true; lastLoad = Date.now(); renderSync();
  const token = getToken();
  try {
    if (token) { board = await fetchBoard(token); source = "board"; }
    else { board = await fetchPublic(); source = "public"; }
    liveError = "";
  } catch (e) { liveError = liveMessage(e); }
  loading = false; render();
}
async function loadSnapshot() {
  try { const r = await fetch("board.json", { cache: "no-store" }); if (r.ok) takeBoard(await r.json(), "snapshot"); } catch (_) {}
}
function openConnect() {
  dlgTask = null;
  dlg.innerHTML = `<div class="dlg"><div class="dlg-head"><div><h2 id="dlgTitle">Connecter le Scrum Board</h2>
      <p class="en">Une fois par navigateur. Le token reste dans ce navigateur et sert seulement à lire le board, à chaque refresh.</p></div>
      <button class="x" data-close aria-label="Fermer">×</button></div>
    <div class="dlg-body">
      <ol class="steps">
        <li>Ouvre <a href="${TOKEN_URL}" target="_blank" rel="noopener">GitHub › New personal access token (classic) ↗</a>. La case <code>read:project</code> est déjà cochée : ne coche rien d'autre.</li>
        <li>Choisis une expiration (par exemple 30 jours), puis clique sur Generate token.</li>
        <li>Copie le token (il commence par <code>ghp_</code>) et colle-le ici.</li>
      </ol>
      <form class="tok" id="tokForm"><label for="tok">Token GitHub</label><input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_…" required><button class="btn primary" type="submit">Connecter</button></form>
      <p class="hint wait" id="tokMsg" hidden></p>
      ${getToken() ? '<div><button class="btn" data-forget>Oublier mon token</button></div>' : ""}
    </div></div>`;
  if (!dlg.open) dlg.showModal();
  setTimeout(() => { const i = document.getElementById("tok"); if (i) i.focus(); }, 30);
}
dlg.addEventListener("submit", async e => {
  if (e.target.id !== "tokForm") return;
  e.preventDefault();
  const input = document.getElementById("tok"), msg = document.getElementById("tokMsg"), btn = e.target.querySelector("button");
  const token = input.value.trim(); if (!token) return;
  btn.disabled = true; btn.textContent = "Lecture du board…"; msg.hidden = true;
  try {
    board = await fetchBoard(token); source = "board"; liveError = ""; lastLoad = Date.now();
    saveToken(token); dlg.close(); render(); toast("Scrum Board connecté : chaque refresh le relit.");
  } catch (err) {
    msg.textContent = liveMessage(err); msg.hidden = false; btn.disabled = false; btn.textContent = "Connecter";
  }
});

/* ---------- render ---------- */
function renderSync() {
  const el = document.getElementById("sync"), txt = document.getElementById("syncText"), ctl = document.getElementById("syncCtl");
  const fmt = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleString("fr-CH", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : null; };
  const when = fmt(board.syncedAt);
  const nManual = Object.keys(manual).filter(k => manualState(k)).length;
  const boardLink = `<a href="${BOARD_URL}" target="_blank" rel="noopener">Scrum Board</a>`;
  let text, ok = false;
  if (loading) text = `Lecture du ${boardLink}…`;
  else if (source === "board") { text = `${boardLink} en direct · lu ${new Date(board.syncedAt).toLocaleTimeString("fr-CH", { hour: "2-digit", minute: "2-digit" })}`; ok = true; }
  else if (source === "public") text = `Issues et PR en direct · ${boardLink} du ${when || "—"}`;
  else text = `${boardLink} · ${when ? "lu " + when : "pas encore lu"}`;
  if (IN_ARTIFACT && live) ok = true;
  if (nManual) text += ` · ${nManual} statut${nManual > 1 ? "s" : ""} mis à la main`;
  if (liveError) text += ` · <span class="err">${esc(liveError)}</span>`;
  el.classList.toggle("live", ok && !liveError);
  el.classList.toggle("warn", !!liveError);
  txt.innerHTML = text;
  ctl.innerHTML = IN_ARTIFACT
    ? `<a class="btn small" href="${PAGES_URL}" target="_blank" rel="noopener">Version en direct ↗</a>`
    : getToken()
      ? `<button class="btn small" data-refresh ${loading ? "disabled" : ""}>Rafraîchir</button><button class="btn small" data-connect>Token</button>`
      : `<button class="btn small primary" data-connect>Connecter le Scrum Board</button>`;
}
function render() {
  renderNav(); renderSync();
  const r = route(), main = document.getElementById("main");
  main.innerHTML = r === "vue" ? renderOverview() : renderPerson(r);
  if (r === "vue") requestAnimationFrame(drawEdges);
  if (dlg.open && dlgTask != null) renderDialog();
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-connect]")) { openConnect(); return; }
  if (e.target.closest("[data-refresh]")) { loadLive(true); return; }
  if (e.target.closest("[data-forget]")) { saveToken(""); dlg.close(); source = "none"; loadSnapshot().then(() => loadLive(true)); toast("Token oublié dans ce navigateur."); return; }
  const set = e.target.closest("[data-set]"); if (set) { setManual(set.dataset.set); return; }
  const img = e.target.closest("[data-img]"); if (img) { openImage(img.dataset.img); return; }
  const op = e.target.closest("[data-open]"); if (op) { e.preventDefault(); openTask(+op.dataset.open); }
});
const mainEl = document.getElementById("main");
mainEl.addEventListener("mouseover", e => { const c = e.target.closest(".map .chip"); focusChain(c ? +c.dataset.n : null); });
mainEl.addEventListener("mouseleave", () => focusChain(null));
mainEl.addEventListener("focusin", e => { const c = e.target.closest(".map .chip"); if (c) focusChain(+c.dataset.n); });
mainEl.addEventListener("focusout", e => { if (e.target.closest(".map .chip")) focusChain(null); });
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(drawEdges, 80); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawEdges);

function takeBoard(data, src) {
  if (source === "board" || !data || typeof data !== "object" || !data.items || typeof data.items !== "object") return;
  const t = Date.parse(data.syncedAt), cur = Date.parse(board.syncedAt);
  if (board.syncedAt && !(t >= cur)) return;
  board = { syncedAt: data.syncedAt, items: data.items };
  source = src;
  render();
}

render();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadLive(false); });
(async () => {
  if (IN_ARTIFACT) { await loadSnapshot(); return; }
  if (getToken()) { await loadLive(true); if (source === "board") return; }
  await loadSnapshot();
  if (!getToken()) await loadLive(true);
})();

(async () => {
  if (!IN_ARTIFACT) return;
  let db = null;
  try { db = await window.claude.use("db"); } catch (_) { db = null; }
  if (!db) return;
  dbRef = db; live = true; renderSync();
  try { const u = await window.claude.use("user"); if (u) canWrite = await u.can("data.write"); } catch (_) { canWrite = null; }
  db.doc("meta/board").onSnapshot(s => { if (s.exists) takeBoard(s.data(), "db"); }, () => { live = false; renderSync(); });
  db.collection("manual").onSnapshot(q => {
    const m = {};
    q.docs.forEach(d => { const x = d.data(); if (x && STATES.includes(x.state) && BY[+d.id]) m[d.id] = { state: x.state, at: x.at }; });
    manual = m; render();
  }, () => {});
  render();
})();
</script>
